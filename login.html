<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sign in · BBI Africa</title>
  <meta name="description" content="Create an account or sign in with your email to apply to the BBI training and certification programme." />
  <meta name="theme-color" content="#0b3d2e" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app-header"></div>

  <section class="page-head">
    <div class="container">
      <div class="breadcrumb"><a href="index.html">Home</a> / Sign in</div>
      <h1>Sign in or create an account</h1>
      <p>Register with your email to apply. New accounts are reviewed by an administrator before you can submit.</p>
    </div>
  </section>

  <main class="section">
    <div class="container" style="max-width:480px">
      <div class="card">
        <div id="not-config" class="notice hidden">🔧 Sign-in is being set up. Please check back shortly.</div>

        <div id="signed-in" class="hidden center">
          <div class="ico" style="margin:0 auto 12px">✅</div>
          <h3>You’re signed in</h3>
          <p class="muted" id="si-email"></p>
          <div class="grid" style="gap:10px">
            <a class="btn btn-primary" href="account.html">Go to my account →</a>
            <a class="btn btn-outline" href="apply.html">Start an application</a>
            <button class="btn btn-outline" id="signout">Sign out</button>
          </div>
        </div>

        <div id="auth-ui">
          <div class="tabs">
            <button class="tab active" data-tab="signin">Sign in</button>
            <button class="tab" data-tab="register">Create account</button>
          </div>

          <form id="signin-form" class="form">
            <label>Email<input type="email" name="email" required autocomplete="email" /></label>
            <label>Password<input type="password" name="password" required autocomplete="current-password" /></label>
            <button class="btn btn-primary" type="submit" id="signin-btn">Sign in</button>
            <button class="btn btn-outline" type="button" id="forgot">Forgot password?</button>
          </form>

          <form id="register-form" class="form hidden">
            <div class="grid cols-2">
              <label>Full name<input name="name" required /></label>
              <label>Country<input name="country" required /></label>
            </div>
            <label>Organisation<input name="org" required /></label>
            <label>Email<input type="email" name="email" required autocomplete="email" /></label>
            <label>Password (min 6 characters)<input type="password" name="password" minlength="6" required autocomplete="new-password" /></label>
            <button class="btn btn-primary" type="submit" id="register-btn">Create account</button>
          </form>

          <div id="auth-msg" class="notice hidden" style="margin-top:14px"></div>
        </div>
      </div>
    </div>
  </main>

  <div id="app-footer"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/notify.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const A = window.BBIAuth, $ = (id) => document.getElementById(id);
      const params = new URLSearchParams(location.search);
      const next = params.get('next') || 'account.html';
      const msg = (t, ok) => { const m = $('auth-msg'); m.textContent = t || ''; m.classList.toggle('hidden', !t); m.style.background = ok ? '#e3f2ec' : '#fff8e8'; };

      if (!A || !A.ready) { $('not-config').classList.remove('hidden'); return; }

      A.onAuth((user) => {
        if (user) { $('si-email').textContent = user.email || ''; $('signed-in').classList.remove('hidden'); $('auth-ui').classList.add('hidden'); }
        else { $('signed-in').classList.add('hidden'); $('auth-ui').classList.remove('hidden'); }
      });

      // Tabs
      document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        const which = t.getAttribute('data-tab');
        $('signin-form').classList.toggle('hidden', which !== 'signin');
        $('register-form').classList.toggle('hidden', which !== 'register');
        msg('');
      }));

      $('signin-form').addEventListener('submit', async (e) => {
        e.preventDefault(); msg(''); const b = $('signin-btn'); b.disabled = true; b.textContent = 'Signing in…';
        try { await A.signIn(e.target.email.value.trim(), e.target.password.value); location.href = next; }
        catch (err) { msg(friendly(err)); } finally { b.disabled = false; b.textContent = 'Sign in'; }
      });

      $('register-form').addEventListener('submit', async (e) => {
        e.preventDefault(); msg(''); const b = $('register-btn'); b.disabled = true; b.textContent = 'Creating…';
        const f = e.target;
        try {
          const email = f.email.value.trim();
          await A.register(email, f.password.value, { name: f.name.value, country: f.country.value, org: f.org.value });
          if (window.BBINotify) {
            await BBINotify.send({
              subject: 'New BBI account registered',
              type: 'New account registration (awaiting approval)',
              name: f.name.value, email: email, country: f.country.value, org: f.org.value,
              line1: '', line2: '', line3: '', line4: '',
              from_name: f.name.value, reply_to: email,
              message: `New account registration (awaiting approval)\n\nName: ${f.name.value}\nEmail: ${email}\nCountry: ${f.country.value}\nOrganisation: ${f.org.value}`
            });
          }
          location.href = 'account.html';
        } catch (err) { msg(friendly(err)); } finally { b.disabled = false; b.textContent = 'Create account'; }
      });

      $('forgot').addEventListener('click', async () => {
        const email = $('signin-form').email.value.trim();
        if (!email) { msg('Enter your email above first, then tap “Forgot password?”.'); return; }
        try { await A.resetPassword(email); msg('Password reset email sent to ' + email + '.', true); }
        catch (err) { msg(friendly(err)); }
      });

      $('signout').addEventListener('click', () => A.signOut());

      function friendly(err) {
        const c = (err && err.code) || '';
        if (c.includes('email-already-in-use')) return 'That email is already registered — try signing in instead.';
        if (c.includes('invalid-email')) return 'That doesn’t look like a valid email address.';
        if (c.includes('weak-password')) return 'Please choose a password of at least 6 characters.';
        if (c.includes('wrong-password') || c.includes('invalid-credential')) return 'Incorrect email or password.';
        if (c.includes('user-not-found')) return 'No account found with that email — create one instead.';
        if (c.includes('too-many-requests')) return 'Too many attempts. Please wait a moment and try again.';
        if (c.includes('operation-not-allowed')) return 'Email sign-in isn’t enabled yet in Firebase (Authentication → Sign-in method → Email/Password).';
        return 'Something went wrong: ' + (err.message || err);
      }
    });
  </script>
</body>
</html>
