<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Professional Directory · BBI Africa</title>
  <meta name="description" content="Searchable directory of biosafety and biosecurity professionals certified through the BBI regional programme." />
  <meta name="theme-color" content="#0b3d2e" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app-header"></div>

  <section class="page-head">
    <div class="container">
      <div class="breadcrumb"><a href="index.html">Home</a> / Directory</div>
      <h1>Professional directory</h1>
      <p>Connect with biosafety and biosecurity professionals and trainers across Africa’s regional networks.</p>
    </div>
  </section>

  <main class="section">
    <div class="container">
      <div class="notice" style="margin-bottom:20px">👥 The profiles below are <strong>illustrative samples</strong> demonstrating the directory. Replace them with the official roster of certified professionals in <code>js/data.js</code>.</div>

      <div class="toolbar">
        <input type="search" id="q" placeholder="Search by name, organisation, country or specialty…" aria-label="Search professionals" />
        <select id="f-region" aria-label="Filter by region"><option value="">All regions</option></select>
        <select id="f-cert" aria-label="Filter by certification"><option value="">All certifications</option></select>
        <label class="chk"><input type="checkbox" id="f-mentor" /> Mentors only</label>
        <span class="count-tag" id="result-count"></span>
      </div>

      <div class="grid cols-3" id="people-grid"></div>
    </div>
  </main>

  <div id="app-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/directory.js"></script>
</body>
</html>
