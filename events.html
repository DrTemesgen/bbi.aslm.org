<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title data-i18n="events.meta.title">Events &amp; Conferences · BBI Africa</title>
  <meta name="description" data-i18n-attr="content=events.meta.desc" content="Upcoming biosafety and biosecurity conferences, trainings and workshops across Africa." />
  <meta name="theme-color" content="#0b3d2e" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app-header"></div>

  <section class="page-head">
    <div class="container">
      <div class="breadcrumb"><a href="index.html" data-i18n="common.home">Home</a> / <span data-i18n="nav.events">Events</span></div>
      <h1 data-i18n="events.head.title">Events &amp; conferences</h1>
      <p data-i18n="events.head.intro">Upcoming conferences, regional trainings and workshops advancing biosafety and biosecurity across Africa.</p>
    </div>
  </section>

  <main class="section">
    <div class="container">
      <div class="toolbar">
        <select id="etype" aria-label="Filter by type" data-i18n-attr="aria-label=events.filter.type"><option value="" data-i18n="common.allTypes">All types</option></select>
        <select id="eregion" aria-label="Filter by region" data-i18n-attr="aria-label=events.filter.region"><option value="" data-i18n="common.allRegions">All regions</option></select>
        <span class="count-tag" id="ecount"></span>
      </div>
      <div class="grid cols-2" id="events-grid"></div>
    </div>
  </main>

  <div id="app-footer"></div>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/data.js"></script>
  <script src="js/offerings.js"></script>
  <script src="js/app.js"></script>
  <script src="js/i18n.js"></script>
  <script src="lang/en.js"></script>
  <script>BBI.i18n.loadActive();</script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const H = BBI.helpers;
      const grid = document.getElementById('events-grid');
      const etype = document.getElementById('etype');
      const eregion = document.getElementById('eregion');
      const ecount = document.getElementById('ecount');
      const items0 = await BBIOfferings.byKind('event');
      [...new Set(items0.map(e => e.type).filter(Boolean))].sort().forEach(t => etype.add(new Option(t, t)));
      BBI.regions.forEach(r => eregion.add(new Option(r.name, r.key)));

      function render() {
        const t = etype.value, reg = eregion.value;
        const items = items0.filter(e => (!t || e.type === t) && (!reg || e.region === reg));
        ecount.textContent = `${items.length} ${BBI.t('events.count', 'events')}`;
        grid.innerHTML = items.map(e => `
          <a class="card" href="event.html?id=${encodeURIComponent(e.id)}" style="display:flex;gap:16px;text-decoration:none;color:inherit">
            <div class="date" style="background:var(--green-100);border-radius:10px;text-align:center;padding:12px 10px;align-self:start;min-width:64px">
              <b style="display:block;font-size:1.5rem;color:var(--green-800);line-height:1">${e.d}</b>
              <span style="font-size:.72rem;color:var(--muted);text-transform:uppercase">${BBI.i18n.month(e.m)} ${e.y}</span>
            </div>
            <div style="flex:1">
              <div style="margin-bottom:6px"><span class="tag gold">${e.type}</span> <span class="tag">${H.regionName(e.region)}</span></div>
              <h3 style="margin:0 0 4px">${e.title}</h3>
              <div class="muted" style="font-size:.86rem;margin-bottom:8px">📍 ${e.loc}</div>
              <p class="muted" style="margin:0 0 12px">${e.desc}</p>
              ${e.reg ? '<span class="btn btn-outline">' + BBI.t('events.viewRegister', 'View & register →') + '</span>' : '<span class="muted" style="font-size:.85rem">' + BBI.t('events.regSoon', 'Registration opening soon') + '</span>'}
            </div>
          </a>`).join('') || `<div class="card center muted" style="grid-column:1/-1">${BBI.t('events.empty', 'No events match.')}</div>`;
      }
      [etype, eregion].forEach(el => el.addEventListener('input', render));
      render();
    });
  </script>
</body>
</html>
