<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Events &amp; Conferences · BBI Africa</title>
  <meta name="description" content="Upcoming biosafety and biosecurity conferences, trainings and workshops across Africa." />
  <meta name="theme-color" content="#0b3d2e" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app-header"></div>

  <section class="page-head">
    <div class="container">
      <div class="breadcrumb"><a href="index.html">Home</a> / Events</div>
      <h1>Events &amp; conferences</h1>
      <p>Upcoming conferences, regional trainings and workshops advancing biosafety and biosecurity across Africa.</p>
    </div>
  </section>

  <main class="section">
    <div class="container">
      <div class="toolbar">
        <select id="etype" aria-label="Filter by type"><option value="">All types</option></select>
        <select id="eregion" aria-label="Filter by region"><option value="">All regions</option></select>
        <span class="count-tag" id="ecount"></span>
      </div>
      <div class="grid cols-2" id="events-grid"></div>
    </div>
  </main>

  <div id="app-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const H = BBI.helpers;
      const grid = document.getElementById('events-grid');
      const etype = document.getElementById('etype');
      const eregion = document.getElementById('eregion');
      const ecount = document.getElementById('ecount');
      [...new Set(BBI.events.map(e => e.type))].sort().forEach(t => etype.add(new Option(t, t)));
      BBI.regions.forEach(r => eregion.add(new Option(r.name, r.key)));

      function render() {
        const t = etype.value, reg = eregion.value;
        const items = BBI.events.filter(e => (!t || e.type === t) && (!reg || e.region === reg));
        ecount.textContent = `${items.length} events`;
        grid.innerHTML = items.map(e => `
          <div class="card" style="display:flex;gap:16px">
            <div class="date" style="background:var(--green-100);border-radius:10px;text-align:center;padding:12px 10px;align-self:start;min-width:64px">
              <b style="display:block;font-size:1.5rem;color:var(--green-800);line-height:1">${e.d}</b>
              <span style="font-size:.72rem;color:var(--muted);text-transform:uppercase">${e.m} ${e.y}</span>
            </div>
            <div style="flex:1">
              <div style="margin-bottom:6px"><span class="tag gold">${e.type}</span> <span class="tag">${H.regionName(e.region)}</span></div>
              <h3 style="margin:0 0 4px">${e.title}</h3>
              <div class="muted" style="font-size:.86rem;margin-bottom:8px">📍 ${e.loc}</div>
              <p class="muted" style="margin:0 0 12px">${e.desc}</p>
              ${e.reg ? '<a class="btn btn-outline" href="mailto:info@aslm.org?subject=Registration%20interest%20-%20' + encodeURIComponent(e.title) + '">Register interest →</a>' : '<span class="muted" style="font-size:.85rem">Registration opening soon</span>'}
            </div>
          </div>`).join('') || `<div class="card center muted" style="grid-column:1/-1">No events match.</div>`;
      }
      [etype, eregion].forEach(el => el.addEventListener('input', render));
      render();
    });
  </script>
</body>
</html>
