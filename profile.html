<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Professional Profile · BBI Africa</title>
  <meta name="description" content="Profile of a biosafety and biosecurity professional in the BBI network." />
  <meta name="theme-color" content="#0b3d2e" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app-header"></div>
  <main id="profile-main"></main>
  <div id="app-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const H = BBI.helpers;
      const id = new URLSearchParams(location.search).get('id');
      const p = id ? H.person(id) : null;
      const main = document.getElementById('profile-main');

      if (!p) {
        main.innerHTML = `<section class="page-head"><div class="container">
          <div class="breadcrumb"><a href="directory.html">Directory</a> / Not found</div>
          <h1>Profile not found</h1><p>We couldn’t find that professional.</p></div></section>
          <section class="section"><div class="container"><a class="btn btn-outline" href="directory.html">← Back to directory</a></div></section>`;
        document.title = 'Profile not found · BBI Africa';
        return;
      }

      document.title = `${p.name} · BBI Africa`;
      const color = H.avatarColor(p.name);
      const certCards = p.certs.map(c => {
        const t = H.certType(c.t);
        return `<div class="card" style="border-left:5px solid ${t.color}">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
            <span class="tag" style="background:${t.color}1a;color:${t.color};font-size:.8rem">${t.abbr}</span>
            <strong>${t.name}</strong>
            <span class="muted" style="margin-left:auto;font-size:.85rem">Certified ${c.y}</span>
          </div>
          <p class="muted" style="margin:0;font-size:.9rem">${t.desc}</p>
        </div>`;
      }).join('');

      main.innerHTML = `
        <section class="page-head">
          <div class="container">
            <div class="breadcrumb"><a href="index.html">Home</a> / <a href="directory.html">Directory</a> / ${p.name}</div>
            <div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">
              <div class="avatar" style="background:${color};width:74px;height:74px;font-size:1.5rem;border:3px solid rgba(255,255,255,.3)">${H.initials(p.name)}</div>
              <div>
                <h1 style="margin-bottom:4px">${p.name}</h1>
                <p style="margin:0">${p.role} · ${p.org}</p>
                <p style="margin:6px 0 0;color:#bfe0d3;font-size:.9rem">📍 ${p.country} · ${H.regionName(p.region)} · ${p.level}${p.mentor ? ' · 🧭 Available as mentor' : ''}</p>
              </div>
            </div>
          </div>
        </section>

        <section class="section">
          <div class="container" style="max-width:860px">
            ${p.hero ? `<div class="card" style="background:linear-gradient(160deg,var(--green-800),var(--green-600));color:#fff;margin-bottom:24px">
              <span class="tag gold">⭐ Biosafety Hero</span>
              <p style="margin:10px 0 0;font-size:1.05rem">“${p.hero}”</p></div>` : ''}

            <h2>About</h2>
            <p class="muted">${p.bio}</p>

            <h2 style="margin-top:28px">Certifications</h2>
            <div class="grid" style="gap:12px">${certCards}</div>

            <h2 style="margin-top:28px">Specialties</h2>
            <div>${p.specialties.map(s => `<span class="tag">${s}</span>`).join('')}</div>

            <div class="grid cols-2" style="margin-top:30px;gap:12px">
              ${p.mentor ? `<a class="btn btn-primary" href="mentorship.html">🧭 Request mentorship</a>` : ''}
              <a class="btn btn-outline" href="directory.html">← Back to directory</a>
            </div>

            <div class="notice" style="margin-top:24px">👤 This is an illustrative sample profile. Replace with the official professional record in <code>js/data.js</code>.</div>
          </div>
        </section>`;
    });
  </script>
</body>
</html>
